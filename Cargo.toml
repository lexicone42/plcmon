[package]
name = "plcmon"
version = "0.1.0"
edition = "2024"
description = "TP-Link Powerline Network Monitor — speaks HomePlug AV directly"

[dependencies]
pcap = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
